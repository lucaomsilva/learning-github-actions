name: Learning-GA CI

on:
  pull_request:
    branches: [ "main", "develop" ]
  push:
    branches: [ "main", "develop" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions: {}

jobs:
  build-env-docker:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and Push Docker Build Environment
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/build-env:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/build-env:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/build-env:buildcache,mode=max

      - name: Run Docker Build Environment
        run: |
          docker run -d --name build-env-${{ github.run_id }} \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          ghcr.io/${{ github.repository }}/build-env:latest sleep infinity

      - name: Lint C Code
        run: |
          docker exec build-env-${{ github.run_id }} make lint

      - name: Run Unit Tests
        run: |
          docker exec build-env-${{ github.run_id }} make test

      - name: Build Application
        run: |
          docker exec build-env-${{ github.run_id }} make build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: bin/app

  trigger_cd:
    needs: build-env-docker
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: ./.github/workflows/cd.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
