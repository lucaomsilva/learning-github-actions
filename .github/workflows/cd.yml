name: Learning-GA CD

on:
  workflow_call:
    inputs:
      tag:
        description: "Version tag"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: app_${{ inputs.tag }}
          path: ./app_${{ inputs.tag }}_release

      - name: validate
        run: |
          ls -la ./app_${{ inputs.tag }}_release
          chmod +x ./app_${{ inputs.tag }}_release/app_${{ inputs.tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: ./app_${{ inputs.tag }}_release/app_${{ inputs.tag }}
          body: "Release version ${{ inputs.tag }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
